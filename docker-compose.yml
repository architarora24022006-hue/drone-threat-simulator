version: '3.8'

services:
  sentinel-drone:
    build: .
    container_name: sentinel_drone_trainer
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
    volumes:
      - sentinel-data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  sentinel-data:
